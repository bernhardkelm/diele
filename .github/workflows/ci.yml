name: CI

on:
  push:
    branches: [main]
    # Releases are tagged without a `v`, so this is the semver shape itself. The trailing `*`
    # admits a prerelease suffix, which the tag rules below then handle on their own.
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

# A second push to the same branch supersedes the first, rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Only the runtime stage of the image is architecture-specific, and the two stages that do work
  # are pinned to the runner's own architecture, so a second platform costs a copy of the runtime
  # layers rather than an emulated install. Adding `,linux/arm64` here is the whole change.
  PLATFORMS: linux/amd64

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      # Builds `common` first, which the other two type-check against.
      - name: Type check
        run: npm run type-check

      # Thresholds are enforced by the scripts themselves, so a drop in coverage fails here.
      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  image:
    # The gate, not a second opinion running beside it: nothing reaches the registry from a tree
    # whose lint, types, tests or coverage did not hold.
    needs: check
    runs-on: ubuntu-latest

    # A job-level map replaces the workflow-level one, so `contents` is restated here.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GHCR takes the owner as it is written, and a repository owner may carry capitals while an
      # image reference may not.
      - name: Resolve the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Nothing to push from a pull request, and a fork's token cannot write packages anyway.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # A prerelease collapses every pattern onto the full version and takes `latest` with it,
          # so `0.4.0-rc1` can move neither `latest` nor `0.4`. The guard on `{{major}}` is the
          # action's own recipe for major version zero: while diele is 0.x, a bare `0` would be a
          # tag that moves across breaking changes.
          tags: |
            type=edge,branch=main
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/0.') }}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
